<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Sys&Réseaux World</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1ab5c8;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #wrap {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: all;
    }

    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      padding: 10px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.65);
      border-bottom: 2px solid #4affaa;
      pointer-events: none;
    }

    #hud-title {
      font-size: 9px;
      color: #4affaa;
    }

    #hud-hint {
      font-size: 8px;
      color: #bbb;
      animation: blink 2s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.2
      }
    }

    #tooltip {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.92);
      border: 2px solid #4affaa;
      color: #4affaa;
      font-size: 9px;
      padding: 12px 22px;
      display: none;
      z-index: 60;
      pointer-events: none;
      white-space: nowrap;
    }

    #tooltip::before {
      content: '► ';
    }

    .modal-wrap {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal-wrap.open {
      display: flex;
    }

    .modal {
      background: #0d1117;
      border: 3px solid #4affaa;
      width: 98%;
      max-width: 1300px;
      max-height: 96vh;
      overflow-y: auto;
    }

    .mh {
      background: #0a2a1a;
      border-bottom: 2px solid #4affaa;
      padding: 22px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mt {
      font-size: 16px;
      color: #4affaa;
    }

    .mc {
      font-size: 12px;
      color: #4affaa;
      cursor: pointer;
      background: none;
      border: 2px solid #4affaa;
      font-family: inherit;
      padding: 10px 18px;
    }

    .mc:hover {
      background: #4affaa;
      color: #000;
    }

    .mb {
      padding: 42px;
    }

    .ph1 {
      font-size: 18px;
      margin-bottom: 22px;
    }

    .ph1.g {
      color: #4affaa;
    }

    .ph1.y {
      color: #ffc864;
    }

    .ph1.b {
      color: #60b0ff;
    }

    .ph1.w {
      color: #fff;
    }

    .psub {
      font-size: 13px;
      color: #666;
      margin-bottom: 28px;
      line-height: 2.2;
    }

    .qgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media(max-width:600px) {
      .qgrid {
        grid-template-columns: 1fr;
      }
    }

    .qcard {
      border: 2px solid #2a5a3a;
      background: #070d08;
      padding: 28px;
      transition: border-color .2s;
    }

    .qcard:hover {
      border-color: #4affaa;
    }

    .qname {
      font-size: 14px;
      color: #4affaa;
      margin-bottom: 14px;
    }

    .qdiff {
      font-size: 10px;
      padding: 6px 12px;
      border: 1px solid;
      float: right;
      margin: 0 0 8px 10px;
    }

    .dh {
      color: #ff6060;
      border-color: #ff6060;
    }

    .dm {
      color: #ffc864;
      border-color: #ffc864;
    }

    .qdesc {
      font-size: 12px;
      color: #666;
      line-height: 2;
      clear: both;
      margin-bottom: 16px;
    }

    .qtags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .qtag {
      font-size: 11px;
      padding: 6px 14px;
      background: #0a1a0d;
      border: 1px solid #2a5a3a;
      color: #4affaa;
    }

    .qxp {
      font-size: 12px;
      color: #ffc864;
      margin-top: 14px;
    }

    .tl {
      padding-left: 18px;
      border-left: 2px solid #4affaa;
    }

    .tli {
      position: relative;
      margin-bottom: 26px;
      padding-left: 16px;
    }

    .tld {
      position: absolute;
      left: -12px;
      top: 2px;
      width: 12px;
      height: 12px;
      background: #4affaa;
    }

    .tly {
      font-size: 12px;
      color: #4affaa;
      margin-bottom: 8px;
    }

    .tlt {
      font-size: 15px;
      color: #fff;
      margin-bottom: 10px;
    }

    .tltx {
      font-size: 12px;
      color: #666;
      line-height: 2;
    }

    .term {
      background: #010a01;
      padding: 28px;
      font-size: 13px;
      line-height: 2.3;
      color: #00ff41;
      min-height: 340px;
      border-top: 2px solid #00ff41;
    }

    .tp {
      color: #4affaa;
    }

    .tbr {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 4px 0;
    }

    .tbb {
      flex: 1;
      height: 16px;
      background: #001200;
      border: 1px solid #00ff41;
      overflow: hidden;
    }

    .tbf {
      height: 100%;
      background: #00ff41;
      transition: width 1.1s ease;
    }

    .tcur {
      display: inline-block;
      width: 9px;
      height: 14px;
      background: #00ff41;
      animation: blink .8s infinite;
      vertical-align: middle;
    }
  </style>
</head>

  <script>
    const IMG_W = 2000, IMG_H = 1008;
    const ZONES = [
      { id: 'cabine', label: '📞 CABINE — Contact', modal: 'cabine', cx: 734, cy: 620, rx: 45, ry: 70, color: '#ff4444', neon: '#ff2222' },
      { id: 'foret', label: '🌲 FORÊT — Projets', modal: 'foret', cx: 1083, cy: 420, rx: 115, ry: 86, color: '#4affaa', neon: '#00ff88' },
      { id: 'route', label: '🛣️ ROUTE 86 — Parcours', modal: 'route', cx: 936, cy: 682, rx: 50, ry: 28, color: '#ffc864', neon: '#ffaa00' },
      { id: 'serveur', label: '🖥️ SERVEUR — Compétences', modal: 'serveur', cx: 1295, cy: 569, rx: 60, ry: 84, color: '#00ff41', neon: '#00ff41' },
      { id: 'perso', label: '👾 PERSONNAGE — Profil', modal: 'perso', cx: 832, cy: 706, rx: 25, ry: 39, color: '#ffffff', neon: '#aaddff' },
    ];
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const bgImg = document.getElementById('bg');
    let W, H, sc, ox, oy;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      const ir = IMG_W / IMG_H, wr = W / H;
      if (wr > ir) { sc = W / IMG_W; ox = 0; oy = (H - IMG_H * sc) / 2; }
      else { sc = H / IMG_H; ox = (W - IMG_W * sc) / 2; oy = 0; }
    }
    resize();
    window.addEventListener('resize', resize);
    const PI2 = Math.PI * 2;
    function toS(ix, iy) { return [ix * sc + ox, iy * sc + oy]; }
    function toI(px, py) { return [(px - ox) / sc, (py - oy) / sc]; }
    function inZ(z, mx, my) { const [ix, iy] = toI(mx, my); const dx = (ix - z.cx) / z.rx, dy = (iy - z.cy) / z.ry; return dx * dx + dy * dy <= 1; }

    let hovZ = null;
    canvas.addEventListener('mousemove', e => {
      hovZ = null;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX;
      const my = e.clientY;
      const [ix, iy] = toI(mx, my);
      for (const z of ZONES) { if (inZ(z, mx, my)) { hovZ = z; break; } }
      canvas.style.cursor = hovZ ? 'pointer' : 'default';
      const tt = document.getElementById('tooltip');
      if (hovZ) { tt.style.display = 'block'; tt.textContent = hovZ.label; }
      else tt.style.display = 'none';
    });
    const PAGE_MAP = { cabine: 'cabine.html', foret: 'foret.html', route: 'route.html', perso: 'perso.html' };
    canvas.addEventListener('click', e => {
      for (const z of ZONES) {
        if (inZ(z, e.clientX, e.clientY)) {
          if (z.modal === 'serveur') { openModal('serveur'); }
          else { window.location.href = PAGE_MAP[z.modal]; }
          return;
        }
      }
    });

    const scales = {};
    ZONES.forEach(z => scales[z.id] = 1);

    function drawZone(z, pulse, hover) {
      scales[z.id] += ((hover ? 1.20 : 1) - scales[z.id]) * 0.10;
      const s = scales[z.id];
      if (s <= 1.003) return;
      const [cx, cy] = toS(z.cx, z.cy);
      const ex = z.rx * sc * s, ey = z.ry * sc * s;
      /* source region in image coords (exact ellipse bounding box) */
      const srcX = Math.max(0, z.cx - z.rx);
      const srcY = Math.max(0, z.cy - z.ry);
      const srcW = z.rx * 2;
      const srcH = z.ry * 2;
      const dstW = srcW * sc * s;
      const dstH = srcH * sc * s;
      const dstX = cx - dstW / 2;
      const dstY = cy - dstH / 2;
      ctx.save();
      /* clip to the exact ellipse so surrounding décor stays hidden */
      ctx.beginPath();
      ctx.ellipse(cx, cy, ex, ey, 0, 0, Math.PI * 2);
      ctx.clip();
      if (hover) { ctx.shadowColor = z.neon; ctx.shadowBlur = 22; }
      if (nightMode) {
        /* Restore original filter for perfect visual match with background */
        ctx.filter = 'brightness(0.55) saturate(0.60) hue-rotate(185deg) contrast(0.95)';
      }
      ctx.drawImage(bgImg, srcX, srcY, srcW, srcH, dstX, dstY, dstW, dstH);
      ctx.restore();
    }

    const sparks = Array.from({ length: 8 }, () => ({
      ix: 1060 + Math.random() * 60, iy: 380 + Math.random() * 80,
      size: Math.random() * 3 + 1.5, phase: Math.random() * Math.PI * 2,
      speed: Math.random() * .2 + .1,
      color: ['#ffee44', '#4affaa', '#ffffff', '#88ffcc'][Math.floor(Math.random() * 4)]
    }));

    /* ── NIGHT MODE ── */
    let nightMode = localStorage.getItem('nightMode') === 'true';
    if (nightMode) {
      document.getElementById('bg').style.filter = 'brightness(0.55) saturate(0.60) hue-rotate(185deg) contrast(0.95)';
    }
    const stars = Array.from({ length: 160 }, () => ({
      ix: Math.random() * IMG_W, iy: Math.random() * 280,
      r: Math.random() * 1.8 + 0.5, phase: Math.random() * Math.PI * 2,
      speed: Math.random() * .6 + .2
    }));
    /* moon position in image coords */
    const MOON = { ix: 140, iy: 80, r: 38 };

    /* Offscreen moon rendering for performance */
    const moonCanvas = document.createElement('canvas');
    function updateMoon() {
      const mr = MOON.r * sc;
      const pad = mr * 3;
      moonCanvas.width = moonCanvas.height = pad * 2;
      const mctx = moonCanvas.getContext('2d');
      const mx = pad, my = pad;
      const glow = mctx.createRadialGradient(mx, my, mr * .3, mx, my, mr * 2.5);
      glow.addColorStop(0, 'rgba(220,235,255,0.18)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      mctx.fillStyle = glow;
      mctx.beginPath(); mctx.arc(mx, my, mr * 2.5, 0, PI2); mctx.fill();
      mctx.save();
      mctx.beginPath(); mctx.arc(mx, my, mr, 0, PI2);
      const moonG = mctx.createRadialGradient(mx - mr * .25, my - mr * .25, mr * .1, mx, my, mr);
      moonG.addColorStop(0, '#f0f4ff'); moonG.addColorStop(0.6, '#c8d8f8'); moonG.addColorStop(1, '#8aabdd');
      mctx.fillStyle = moonG; mctx.shadowColor = '#aaccff'; mctx.shadowBlur = 18 * sc; mctx.fill();
      mctx.globalCompositeOperation = 'destination-out';
      mctx.beginPath(); mctx.arc(mx + mr * .42, my - mr * .1, mr * .82, 0, PI2); mctx.fill();
      mctx.restore();
    }
    updateMoon();
    window.addEventListener('resize', updateMoon);


    let t = 0;
    function frame(ts) {
      t = ts * .001;
      ctx.clearRect(0, 0, W, H);

      /* ── night sky overlay ── */
      if (nightMode) {
        /* deep blue sky gradient over top half */
        const skyH = Math.max(H * .55, oy + IMG_H * sc * .45);
        const grad = ctx.createLinearGradient(0, 0, 0, skyH);
        grad.addColorStop(0, 'rgba(4,8,30,0.82)');
        grad.addColorStop(1, 'rgba(8,14,45,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, skyH);

        /* stars (optimized: no shadowBlur in loop) */
        ctx.fillStyle = '#e8f0ff';
        for (const s of stars) {
          const alpha = (Math.sin(t * s.speed + s.phase) + 1) / 2;
          const [px, py] = toS(s.ix, s.iy);
          if (py < 0 || py > H * .65) continue;
          ctx.globalAlpha = 0.3 + alpha * 0.7;
          ctx.beginPath();
          ctx.arc(px, py, s.r * (0.7 + alpha * .5), 0, PI2);
          ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        /* pre-rendered moon */
        const [mx, my] = toS(MOON.ix, MOON.iy);
        const moonDim = moonCanvas.width;
        ctx.drawImage(moonCanvas, mx - moonDim / 2, my - moonDim / 2);

        /* antenna red glow (server) */
        const [sAntX, sAntY] = toS(1266, 468);
        const antAlpha = 0.4 + ((Math.sin(t * 3) + 1) / 2) * 0.6;
        ctx.save();

        // Core dot (server)
        ctx.fillStyle = `rgba(255,50,50,${antAlpha})`;
        ctx.shadowColor = 'red';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(sAntX, sAntY, 3 * sc, 0, PI2);
        ctx.fill();

        // Large pulsing halo (server)
        const glowRad = 40 * sc;
        const antGlow = ctx.createRadialGradient(sAntX, sAntY, 0, sAntX, sAntY, glowRad);
        antGlow.addColorStop(0, `rgba(255,20,20,${antAlpha * 0.5})`);
        antGlow.addColorStop(1, 'rgba(255,0,0,0)');
        ctx.fillStyle = antGlow;
        ctx.beginPath();
        ctx.arc(sAntX, sAntY, glowRad, 0, PI2);
        ctx.fill();

        /* hill antenna signal waves */
        // Adjusting coordinates to align exactly on the blue triangle
        const [hAntX, hAntY] = toS(851, 246);

        // Triangle core glow (cyan/blue)
        const hAntAlpha = 0.5 + ((Math.sin(t * 2) + 1) / 2) * 0.5;
        const hGlowRad = 30 * sc;
        const hAntGlow = ctx.createRadialGradient(hAntX, hAntY, 0, hAntX, hAntY, hGlowRad);
        hAntGlow.addColorStop(0, `rgba(50,200,255,${hAntAlpha * 0.7})`);
        hAntGlow.addColorStop(1, 'rgba(50,200,255,0)');
        ctx.fillStyle = hAntGlow;
        ctx.beginPath();
        ctx.arc(hAntX, hAntY, hGlowRad, 0, PI2);
        ctx.fill();

        // Animated radiating waves (arcs)
        ctx.lineWidth = 2 * sc;
        for (let i = 0; i < 3; i++) {
          // Slowed down speed (from 0.8 to 0.4)
          let wt = (t * 0.4 - i * 0.33) % 1.0;
          if (wt < 0) wt += 1.0;

          const waveRadius = 15 * sc + wt * 80 * sc;
          const waveAlpha = (1.0 - wt) * 0.8;

          ctx.strokeStyle = `rgba(150,220,255,${waveAlpha})`;

          // Left arc
          ctx.beginPath();
          ctx.arc(hAntX, hAntY, waveRadius, Math.PI - 0.6, Math.PI + 0.6);
          ctx.stroke();

          // Right arc
          ctx.beginPath();
          ctx.arc(hAntX, hAntY, waveRadius, -0.6, 0.6);
          ctx.stroke();

          // Top arc (New)
          ctx.beginPath();
          ctx.arc(hAntX, hAntY, waveRadius, -Math.PI / 2 - 0.6, -Math.PI / 2 + 0.6);
          ctx.stroke();
        }

        ctx.restore();
      }

      for (const z of ZONES) {
        const hover = hovZ && hovZ.id === z.id;
        const pulse = (Math.sin(t * 2.2 + ZONES.indexOf(z) * 1.2) + 1) / 2;
        drawZone(z, pulse, hover);
      }
      for (const s of sparks) {
        const alpha = Math.abs(Math.sin(t * s.speed + s.phase)) * .85;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = s.color;
        const [px, py] = toS(s.ix, s.iy);
        ctx.beginPath();
        for (let p = 0; p < 8; p++) {
          const a = p * Math.PI / 4, r = p % 2 === 0 ? s.size : s.size * 0.35;
          p === 0 ? ctx.moveTo(px + Math.cos(a) * r, py + Math.sin(a) * r) : ctx.lineTo(px + Math.cos(a) * r, py + Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();
        s.iy -= .1; if (s.iy < 330) { s.iy = 460; s.ix = 1060 + Math.random() * 60; }
      }
      ctx.globalAlpha = 1.0;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    /* ── CMD TERMINAL ── */
    const PROMPT = 'C:\\Portfolio\\SERVEUR> ';
    const COMMANDS = {
      help: () => [
        '<span style="color:#ffc864">Commandes disponibles :</span>',
        '  <span style="color:#4affaa">help</span>    — affiche cette aide',
        '  <span style="color:#4affaa">night</span>   — active le mode nuit \ud83c\udf19',
        '  <span style="color:#4affaa">day</span>     — restaure le mode jour \u2600\ufe0f',
        '  <span style="color:#4affaa">clear</span>   — efface le terminal',
        '  <span style="color:#4affaa">exit</span>    — ferme le terminal',
      ],
      night: () => {
        nightMode = true;
        localStorage.setItem('nightMode', 'true');
        document.getElementById('bg').style.filter = 'brightness(0.55) saturate(0.60) hue-rotate(185deg) contrast(0.95)';
        return ['<span style="color:#aaddff">\ud83c\udf19 Mode nuit activ\u00e9. Tape <b>day</b> pour revenir.</span>'];
      },
      day: () => {
        nightMode = false;
        localStorage.setItem('nightMode', 'false');
        document.getElementById('bg').style.filter = '';
        return ['<span style="color:#ffc864">\u2600\ufe0f  Mode jour restaur\u00e9.</span>'];
      },
      clear: () => { initTerm(); return null; },
      exit: () => { closeModal('serveur'); return null; },
    };
    const cmdHistory = [];
    let histIdx = -1;
    function termPrint(lines) {
      const out = document.getElementById('term-output');
      if (!lines) return;
      lines.forEach(l => {
        const row = document.createElement('div');
        row.innerHTML = l;
        out.appendChild(row);
      });
      out.scrollTop = out.scrollHeight;
    }
    function termEcho(cmd) {
      const out = document.getElementById('term-output');
      const row = document.createElement('div');
      row.innerHTML = `<span style="color:#888">${PROMPT}</span><span style="color:#fff">${cmd}</span>`;
      out.appendChild(row);
      out.scrollTop = out.scrollHeight;
    }
    function initTerm() {
      const out = document.getElementById('term-output');
      out.innerHTML = '';
      termPrint([
        '<span style="color:#00ff41">Microsoft Windows [Version 10.0 — Portfolio OS]</span>',
        '<span style="color:#666">(c) Sys&amp;Réseaux World. Tous droits réservés.</span>',
        '',
        'Tape <span style="color:#4affaa">help</span> pour afficher les commandes disponibles.',
        '',
      ]);
    }
    function handleCmd(e) {
      if (e.key === 'ArrowUp') { e.preventDefault(); if (histIdx < cmdHistory.length - 1) { histIdx++; document.getElementById('term-input').value = cmdHistory[cmdHistory.length - 1 - histIdx]; } return; }
      if (e.key === 'ArrowDown') { e.preventDefault(); if (histIdx > 0) { histIdx--; document.getElementById('term-input').value = cmdHistory[cmdHistory.length - 1 - histIdx]; } else { histIdx = -1; document.getElementById('term-input').value = ''; } return; }
      if (e.key !== 'Enter') return;
      const inp = document.getElementById('term-input');
      const raw = inp.value.trim();
      inp.value = '';
      histIdx = -1;
      if (!raw) return;
      cmdHistory.push(raw);
      termEcho(raw);
      const key = raw.toLowerCase().split(' ')[0];
      if (COMMANDS[key]) {
        const res = COMMANDS[key]();
        if (res) termPrint(res);
      } else {
        termPrint([`<span style="color:#ff6060">'${raw}' n'est pas reconnu. Tape <b>help</b>.</span>`]);
      }
      termPrint(['']);
    }

    let termBusy = false;
    function playTerm() { initTerm(); setTimeout(() => document.getElementById('term-input').focus(), 50); }

    function openModal(id) {
      const el = document.getElementById('modal-' + id);
      if (el) el.classList.add('open');
      if (id === 'serveur') setTimeout(playTerm, 150);
      el.addEventListener('click', function h(e) { if (e.target === el) { closeModal(id); el.removeEventListener('click', h); } });
    }
    function closeModal(id) {
      const el = document.getElementById('modal-' + id);
      if (el) el.classList.remove('open');
      termBusy = false;
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') document.querySelectorAll('.modal-wrap').forEach(m => m.classList.remove('open'));
    });
  </script>
</body>
