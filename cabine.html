<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📞 Cabine — Contact | Sys&Réseaux World</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d1117;font-family:'Press Start 2P',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;}
.back-btn{position:fixed;top:20px;left:20px;background:none;border:2px solid #80d0ff;color:#80d0ff;font-family:inherit;font-size:10px;padding:10px 18px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:8px;transition:all .2s;z-index:100;}
.back-btn:hover{background:#80d0ff;color:#000;}
.page-wrap{background:#0d1117;border:3px solid #80d0ff;width:100%;max-width:800px;padding:0;}
.mh{background:#081828;border-bottom:2px solid #80d0ff;padding:22px 30px;}
.mt{font-size:16px;color:#80d0ff;}
.mb{padding:42px;}
.ph1{font-size:18px;margin-bottom:22px;color:#60b0ff;}
.psub{font-size:13px;color:#666;margin-bottom:28px;line-height:2.2;}
.crow{display:flex;align-items:center;gap:14px;padding:20px 0;border-bottom:1px solid #1a3a2a;font-size:13px;}
.ckey{color:#80d0ff;min-width:200px;}
.cval{color:#ccc;}
.clinks{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;}
.clink{padding:16px 26px;border:2px solid #80d0ff;color:#80d0ff;text-decoration:none;font-size:12px;font-family:inherit;transition:all .2s;}
.clink:hover{background:#80d0ff;color:#000;}
.neon-title{text-shadow:0 0 10px #80d0ff,0 0 20px #80d0ff;}
</style>
</head>
<body>
<a href="index.html" class="back-btn">← RETOUR</a>

<div class="page-wrap">
  <div class="mh">
    <span class="mt neon-title">📞 CABINE — CONTACT</span>
  </div>
  <div class="mb">
    <div class="ph1">Envoyer un signal</div>
    <div class="psub">Ligne directe. Réponse &lt; 24h.</div>
    <div class="crow"><span class="ckey">// EMAIL</span><span class="cval">ton.email@example.com</span></div>
    <div class="crow"><span class="ckey">// LOCALISATION</span><span class="cval">France — Remote OK</span></div>
    <div class="crow"><span class="ckey">// STATUT</span><span class="cval" style="color:#4affaa;">● ONLINE</span></div>
    <div class="crow" style="border:none;"><span class="ckey">// PING</span><span class="cval" style="color:#ffc864;">2ms ↗</span></div>
    <div class="clinks">
      <a href="mailto:ton@email.com" class="clink">✉ EMAIL</a>
      <a href="https://linkedin.com" target="_blank" class="clink">in LINKEDIN</a>
      <a href="https://github.com" target="_blank" class="clink">⌥ GITHUB</a>
    </div>
  </div>
</div>

</body>
</html>
